
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazenda Feliz</title>
<style>
:root {
  --green:#557d3e;
  --deep:#34532e;
  --gold:#e6bd70;
  --cream:#fff3d7;
  --brown:#79512f;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:#493a27;
  font-family:Georgia,serif;
  background:
    radial-gradient(ellipse at top,#f7edda,#d9c7a5 85%);
}
button{font:inherit;cursor:pointer}
.topbar{
  min-height:76px;
  padding:10px 3%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  color:#fff8df;
  background:linear-gradient(180deg,#789b50,#456b36);
  border-bottom:5px solid #34532e;
  box-shadow:0 4px 12px #38271955;
}
.brand{
  font-size:27px;
  font-weight:bold;
  text-shadow:2px 3px 3px #253e24;
}
.resources{display:flex;gap:9px;flex-wrap:wrap}
.resource{
  background:#36572f;
  border:1px solid #b1c77b;
  border-radius:22px;
  padding:8px 15px;
  box-shadow:inset 0 1px #ffffff35;
  font-weight:bold;
}
main{max-width:1300px;margin:auto;padding:16px}
.gameframe{
  overflow:hidden;
  border:5px solid #987044;
  border-radius:17px;
  background:#f6e9c9;
  box-shadow:0 9px 25px #47341f35;
}
.scenehead{
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  background:linear-gradient(#f9e9c6,#e8d0a0);
  border-bottom:2px solid #b18a55;
}
.scenehead strong{font-size:19px}
.scenehead span{color:#766044}
#world{
  display:block;
  width:100%;
  height:auto;
  background:#9dbb77;
  touch-action:manipulation;
}
.plot{cursor:pointer}
.plot:hover .plot-edge{stroke:#fff1a0;stroke-width:5}
.toolbar{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  padding:14px;
  background:linear-gradient(#e9d5ad,#d7bd8b);
  border-top:3px solid #a47b49;
}
.tool{
  min-width:105px;
  padding:9px 13px;
  border:2px solid #a27b49;
  border-radius:12px;
  color:#503a21;
  background:linear-gradient(#fff5d9,#e9ce91);
  box-shadow:0 3px 4px #4a321c25;
  font-weight:bold;
}
.tool span{display:block;font-size:23px;margin-bottom:3px}
.tool.active{
  background:linear-gradient(#d2e7a8,#93b96a);
  border-color:#52783d;
}
.tool:hover,.action:hover{filter:brightness(1.07)}
.info{
  padding:11px 16px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  background:#fff8e7;
  font-size:14px;
}
#message{font-weight:bold;color:#58763c;min-height:20px}
.progress{
  width:120px;height:9px;
  display:inline-block;
  overflow:hidden;
  border-radius:10px;
  background:#ded0ad;
  vertical-align:middle;
}
.progress i{
  display:block;width:0;height:100%;
  background:linear-gradient(90deg,#a5c76b,#547d3d);
}
.modalback{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:#211b14bb;
}
.modal{
  width:min(700px,100%);
  max-height:85vh;
  overflow:auto;
  background:#fff3d7;
  border:5px solid #a47a48;
  border-radius:16px;
  box-shadow:0 15px 40px #0007;
}
.modalhead{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:white;
  background:linear-gradient(#779b50,#456b36);
  font-size:21px;
}
.close{
  width:35px;height:35px;
  border:0;border-radius:50%;
  background:#fff0d0;color:#503820;
  font-size:22px;
}
.modalbody{padding:16px}
.shopgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:11px;
}
.shopitem{
  padding:13px;
  text-align:center;
  border:2px solid #d1b27d;
  border-radius:12px;
  background:#f7e9c8;
}
.shopitem .emoji{font-size:37px}
.shopitem h3{margin:5px}
.shopitem p{font-size:13px;margin:6px}
.action{
  padding:8px 13px;
  border:2px solid #956b39;
  border-radius:9px;
  color:#513a20;
  background:linear-gradient(#fff1c7,#e7c477);
  font-weight:bold;
}
.action:disabled{opacity:.45;cursor:not-allowed}
.notice{text-align:center;color:#806b4b;font-size:12px}
@media(max-width:600px){
  main{padding:6px}
  .brand{font-size:22px}
  .resource{font-size:12px;padding:6px 9px}
  .tool{min-width:76px;padding:8px 5px;font-size:12px}
  .tool span{font-size:20px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🌻 Fazenda Feliz</div>
  <div class="resources">
    <div class="resource">🪙 <b id="coins">250</b></div>
    <div class="resource">⭐ Nível <b id="level">1</b></div>
    <div class="resource">✨ XP <b id="xp">0</b></div>
  </div>
</header>

<main>
<section class="gameframe">
  <div class="scenehead">
    <strong>🏡 Minha fazenda</strong>
    <span>Um lugar para cultivar seus sonhos</span>
  </div>

  <svg id="world" viewBox="0 0 1100 650"
       xmlns="http://www.w3.org/2000/svg"

    <path d="M350 324Q420 296 485 319T650 324Q740 344 805 300"

    <path d="M350 315Q420 291 485 312T650 317Q740 336 805 293"

    <path d="M762 184Q785 157 839 162Q901 153 938 182

    <path d="M790 185q25 -10 48 -2m40 20q22 -8 43 -2"

    <g transform="translate(170 210)">

      <path d="M-8 12L-6 -39L8 -39L12 12Z" fill="#79502e"/>
      <circle cx="-15" cy="-49" r="30" fill="#356c38"/>
      <circle cx="14" cy="-53" r="33" fill="url(#leaf)"/>
      <circle cx="-2" cy="-75" r="27" fill="#60994a"/>
      <circle cx="-25" cy="-53" r="13" fill="#80b65d"/>
      <circle cx="24" cy="-43" r="15" fill="#77a951"/>
      <circle cx="-5" cy="-83" r="9" fill="#a0c86c" opacity=".65"/>
    </g>
    <g transform="translate(330 145) scale(.8)">
      <ellipse cx="0" cy="20" rx="45" ry="14" fill="#41683b" opacity=".3"/>
      <path d="M-8 12L-6 -39L8 -39L12 12Z" fill="#79502e"/>
      <circle cx="-15" cy="-49" r="30" fill="#356c38"/>
      <circle cx="14" cy="-53" r="33" fill="url(#leaf)"/>
      <circle cx="-2" cy="-75" r="27" fill="#60994a"/>
      <circle cx="-25" cy="-53" r="13" fill="#80b65d"/>
      <circle cx="24" cy="-43" r="15" fill="#77a951"/>
    </g>
    <g transform="translate(940 300) scale(1.05)">
      <ellipse cx="0" cy="20" rx="45" ry="14" fill="#41683b" opacity=".3"/>
      <path d="M-8 12L-6 -39L8 -39L12 12Z" fill="#79502e"/>
      <circle cx="-15" cy="-49" r="30" fill="#356c38"/>
      <circle cx="14" cy="-53" r="33" fill="url(#leaf)"/>
      <circle cx="-2" cy="-75" r="27" fill="#60994a"/>
      <circle cx="-25" cy="-53" r="13" fill="#80b65d"/>
      <circle cx="24" cy="-43" r="15" fill="#77a951"/>
    </g>

    <!-- Casa principal -->
    <g transform="translate(710 260)">
      <ellipse cx="0" cy="65" rx="105" ry="25" fill="#29452c" opacity=".22"/>
      <path d="M-78 -6L0 -47L78 -6V59L0 94L-78 59Z"
            fill="#9c7048"/>
      <path d="M-78 -6L0 -47V30L-78 59Z" fill="#d2ad79"/>
      <path d="M0 -47L78 -6V59L0 30Z" fill="url(#wall)"/>
      <path d="M-91 -8L0 -83L93 -8L77 1L0 -61L-77 1Z"
            fill="url(#roof)" stroke="#743e30" stroke-width="3"/>
      <path d="M0 -83L93 -8L77 1L0 -61Z" fill="#8b4935"/>
      <path d="M-78 -8L0 -61L0 -52L-76 10Z"
            fill="#d18a5b" opacity=".6"/>
      <path d="M-8 39L15 29V80L-8 91Z" fill="#68452d"/>
      <path d="M15 29L37 39V72L15 80Z" fill="#855b39"/>
      <path d="M-59 16L-36 4V32L-59 44Z" fill="#77aeb0" stroke="#775334" stroke-width="4"/>
      <path d="M43 6L65 17V44L43 33Z" fill="#77aeb0" stroke="#775334" stroke-width="4"/>
      <path d="M-53 24L-42 18M49 15L59 20" stroke="#e7f0d4" stroke-width="3"/>

    <!-- Cerca de madeira -->
    <g stroke="#e5d0a2" stroke-linecap="round">

      <path d="M400 210L400 252M442 232L442 273M485 253L485 295
               M528 253L528 274M568 214L568 253"

    <g transform="translate(135 385)">

            fill="#a87542" stroke="#68452c" stroke-width="3"/>

  <div class="info">
    <span id="message">Bem-vindo à sua fazenda! 🌻</span>
    <span>Progresso: <span class="progress"><i id="xpbar"></i></span></span>

  <nav class="toolbar">
    <button class="tool active" data-mode="select" onclick="setMode('select')">
      <span>👆</span>Selecionar
    </button>
    <button class="tool" data-mode="plant" onclick="setMode('plant')">
      <span>🌱</span>Plantar
    </button>
    <button class="tool" data-mode="water" onclick="setMode('water')">
      <span>💧</span>Regar
    </button>
    <button class="tool" data-mode="harvest" onclick="setMode('harvest')">
      <span>🧺</span>Colher
    </button>
    <button class="tool" onclick="showShop()">
      <span>🏪</span>Loja
    </button>
    <button class="tool" onclick="showInventory()">
      <span>🎒</span>Inventário
    </button>

<p class="notice">Fazenda Feliz • Sua história começa aqui</p>
</main>

<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()">
  <section class="modal">
    <div class="modalhead">
      <strong id="modalTitle">Loja</strong>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modalbody" id="modalbody"></div>
  </section>
</div>

<script>
const crops={
  trigo:{name:'Trigo',emoji:'🌾',cost:10,sell:24,time:25,xp:5},
  cenoura:{name:'Cenoura',emoji:'🥕',cost:18,sell:42,time:40,xp:8},
  milho:{name:'Milho',emoji:'🌽',cost:30,sell:70,time:60,xp:12},
  morango:{name:'Morango',emoji:'🍓',cost:45,sell:105,time:90,xp:18}
};

let state={
  coins:250,xp:0,level:1,mode:'select',seed:'trigo',
  inventory:{trigo:5,cenoura:0,milho:0,morango:0},
  plots:Array.from({length:6},()=>null),
  unlocked:6
};

const plotPositions=[
  [420,355],[520,405],[620,355],
  [520,305],[620,255],[720,305]
];

function save(){
  try{localStorage.setItem('fazendaFeliz_v3',JSON.stringify(state))}
  catch(e){}
}
function load(){
  try{
    let s=JSON.parse(localStorage.getItem('fazendaFeliz_v3'));
    if(!s){
      const old=JSON.parse(localStorage.getItem('fazendaFeliz_v2'));
      if(old)s=old;
    }
    if(s){
      state={...state,...s};
      state.inventory={...state.inventory,...s.inventory};
      state.plots=Array.isArray(s.plots)?s.plots:state.plots;
    }
  }catch(e){}
  while(state.plots.length<state.unlocked)state.plots.push(null);
}
function say(t){
  document.getElementById('message').textContent=t;
}
function update(){
  document.getElementById('coins').textContent=state.coins;
  document.getElementById('xp').textContent=state.xp;
  document.getElementById('level').textContent=state.level;
  document.getElementById('xpbar').style.width=
    (state.xp/(state.level*100)*100)+'%';
  drawPlots();
  save();
}
function setMode(m){
  state.mode=m;
  document.querySelectorAll('[data-mode]').forEach(b=>
    b.classList.toggle('active',b.dataset.mode===m)
  );
  const messages={
    select:'Selecione um canteiro para ver sua situação.',
    plant:'Escolha uma semente e clique em um canteiro vazio.',
    water:'Clique em uma plantação para regar.',
    harvest:'Clique em uma plantação madura para colher.'
  };
  say(messages[m]);
}
function addXP(n){
  state.xp+=n;
  while(state.xp>=state.level*100){
    state.xp-=state.level*100;
    state.level++;
    say('Parabéns! Você chegou ao nível '+state.level+'!');
  }
}
function plant(i){
  if(state.plots[i]){
    say('Este canteiro já está ocupado.');
    return;
  }
  const s=crops[state.seed];
  if(state.inventory[state.seed]<=0){
    say('Você não tem essa semente. Visite a loja!');
    return;
  }
  state.inventory[state.seed]--;
  state.plots[i]={type:state.seed,planted:Date.now(),watered:false};
  say(s.name+' plantado! Aguarde crescer.');
  update();
}
function water(i){
  const p=state.plots[i];
  if(!p){say('Não há nada plantado aqui.');return;}
  if(p.watered){say('Esta plantação já foi regada.');return;}
  p.watered=true;
  p.planted-=Math.floor(crops[p.type].time*1000*.15);
  say('Plantação regada! O crescimento foi acelerado.');
  update();
}
function harvest(i){
  const p=state.plots[i];
  if(!p){say('Este canteiro está vazio.');return;}
  const s=crops[p.type];
  if(Date.now()<p.planted+s.time*1000){
    say('Ainda está crescendo! Espere mais um pouquinho.');
    return;
  }
  state.coins+=s.sell;
  addXP(s.xp);
  state.plots[i]=null;
  say('Você colheu '+s.name+'! +'+s.sell+' moedas e +'+s.xp+' XP.');
  update();
}
function clickPlot(i){
  if(i>=state.unlocked)return;
  if(state.mode==='plant')plant(i);
  else if(state.mode==='water')water(i);
  else if(state.mode==='harvest')harvest(i);
  else{
    const p=state.plots[i];
    if(!p)say('Canteiro vazio. Escolha plantar para cultivar.');
    else{
      const s=crops[p.type];
      const left=Math.max(0,Math.ceil(
        (p.planted+s.time*1000-Date.now())/1000
      ));
      say(left?s.name+' crescendo. Faltam '+left+' segundos.':
        s.name+' está pronta para colher!');
    }
  }
}
function plotMarkup(i){
  const [x,y]=plotPositions[i%plotPositions.length];
  return `
  <g class="plot" data-plot="${i}" transform="translate(${x} ${y})">
    <path d="M0 -30L64 0L0 30L-64 0Z"
          fill="#65472e" opacity=".28" transform="translate(0 8)"/>
    <path class="plot-edge"
          d="M0 -30L64 0L0 30L-64 0Z"
          fill="#9a7045" stroke="#e2c18a" stroke-width="3"/>
    <path d="M0 -23L49 0L0 23L-49 0Z"
          fill="#795437" stroke="#b78c5a" stroke-width="2"/>
    <path d="M-34 -7L0 9L34 -7M-34 2L0 18L34 2"
          fill="none" stroke="#a77b4f" stroke-width="2"/>
    <g class="crop-art"></g>
  </g>`;
}
function drawPlots(){
  const root=document.getElementById('plots');
  root.innerHTML='';
  for(let i=0;i<state.unlocked;i++){
    root.insertAdjacentHTML('beforeend',plotMarkup(i));
    const group=root.lastElementChild;
    const p=state.plots[i];
    if(!p)continue;
    const art=group.querySelector('.crop-art');
    const s=crops[p.type];
    const progress=Math.min(1,(Date.now()-p.planted)/(s.time*1000));
    const ready=progress>=1;
    const count=ready?5:Math.max(1,Math.ceil(progress*5));
    let plants='';
    for(let j=0;j<count;j++){
      const px=(j%3-1)*19;
      const py=(j>2?7:-3);
      if(ready){
        plants+=`
        <g transform="translate(${px} ${py})">
          <path d="M0 0Q-2 -12 0 -18" stroke="#3c7139" stroke-width="3" fill="none"/>
          <ellipse cx="-6" cy="-15" rx="7" ry="4"
                   transform="rotate(-25 -6 -15)" fill="#70a84d"/>
          <ellipse cx="7" cy="-18" rx="7" ry="4"
                   transform="rotate(25 7 -18)" fill="#8cbd5d"/>
          <circle cx="0" cy="-23" r="5" fill="${
            p.type==='morango'?'#c64d42':
            p.type==='cenoura'?'#e48d3f':
            p.type==='milho'?'#e6c34e':'#c6a44f'
          }"/>
        </g>`;
      }else{
        plants+=`
        <g transform="translate(${px} ${py})">
          <path d="M0 0Q-2 -10 0 -15" stroke="#3c7139" stroke-width="3" fill="none"/>
          <ellipse cx="-5" cy="-12" rx="6" ry="3"
                   transform="rotate(-25 -5 -12)" fill="#70a84d"/>
          <ellipse cx="6" cy="-15" rx="6" ry="3"
                   transform="rotate(25 6 -15)" fill="#8cbd5d"/>
        </g>`;
      }
    }
    art.innerHTML=plants;
  }
}
function showShop(){
  document.getElementById('modalTitle').textContent='Loja da Fazenda';
  document.getElementById('modalbody').innerHTML=
    '<p>Escolha sementes para sua plantação.</p><div class="shopgrid">'+
    Object.entries(crops).map(([id,s])=>`
      <article class="shopitem">
        <div class="emoji">${s.emoji}</div>
        <h3>${s.name}</h3>
        <p>Preço: ${s.cost} moedas</p>
        <p>Colheita: ${s.sell} moedas</p>
        <p>Tempo: ${s.time} segundos</p>
        <button class="action" onclick="buySeed('${id}')">Comprar 1</button>
        <p>Estoque: ${state.inventory[id]}</p>
      </article>`).join('')+
    '</div><p style="text-align:center">Saldo: '+state.coins+' moedas</p>';
  openModal();
}
function buySeed(id){
  const s=crops[id];
  if(state.coins<s.cost){say('Moedas insuficientes!');return;}
  state.coins-=s.cost;
  state.inventory[id]++;
  state.seed=id;
  update();
  showShop();
  say('Você comprou uma semente de '+s.name+'.');
  setMode('plant');
}
function showInventory(){
  document.getElementById('modalTitle').textContent='Inventário';
  document.getElementById('modalbody').innerHTML=
    '<div class="shopgrid">'+
    Object.entries(crops).map(([id,s])=>`
      <article class="shopitem">
        <div class="emoji">${s.emoji}</div>
        <h3>${s.name}</h3>
        <p>Quantidade: <b>${state.inventory[id]}</b></p>
        <button class="action" onclick="chooseSeed('${id}')">Selecionar</button>
      </article>`).join('')+'</div>';
  openModal();
}
function chooseSeed(id){
  state.seed=id;
  setMode('plant');
  closeModal();
  say('Semente selecionada: '+crops[id].name+'.');
}
function openModal(){
  document.getElementById('modalback').style.display='flex';
}
function closeModal(){
  document.getElementById('modalback').style.display='none';
}
document.getElementById('plots').addEventListener('click',e=>{
  const group=e.target.closest('[data-plot]');
  if(group)clickPlot(Number(group.dataset.plot));
});

load();
update();
setInterval(()=>{
  drawPlots();
},1000);
setInterval(save,5000);
</script>
</body>
</html>
